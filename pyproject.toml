[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoorca-mvp"
version = "0.1.0"
description = "Coordinate-first molecular editor and local ORCA visualization MVP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "numpy==2.3.2",
  "pyvista==0.46.1",
  "orca-pi==2.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "httpx==0.28.1", "ruff==0.12.8"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["orca: requires a licensed local ORCA installation"]
addopts = "-m 'not orca'"

[tool.ruff]
line-length = 100
target-version = "py311"
